[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kimi-coding-agent-flywheel"
version = "0.2.0"
description = "Failure diagnosis and clustering worker for Agent Quality."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
  { name = "Quality Flywheel contributors" },
]
keywords = ["agent-evaluation", "failure-analysis", "observability", "quality"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "agent-quality>=0.2.0",
  "numpy>=1.26",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/low1408/Quality-Flywheel-tool"
Repository = "https://github.com/low1408/Quality-Flywheel-tool.git"
Issues = "https://github.com/low1408/Quality-Flywheel-tool/issues"

[project.scripts]
aq-flywheel = "kimi_coding_agent_flywheel.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["kimi_coding_agent_flywheel*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
